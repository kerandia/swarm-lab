# NVIDIA OpenShell policy for the autonomous OpenCode figure build.
#
# Network is an allowlist: only the OpenCode binary may call Token Factory's chat
# endpoint (with the key injected by the provider binding) and read packages from the
# npm registry (OpenCode installs its provider SDK on first use). Everything else,
# including the devlab's private network and cloud metadata, is denied.

version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /var/log
    - /dev/urandom
    - /sandbox
  read_write:
    - /sandbox/work
    - /home/sandbox
    - /tmp
    - /dev/null
    - /dev/shm

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nebius_chat_completions:
    name: nebius-chat-completions-only
    endpoints:
      - host: api.studio.nebius.ai
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: swarm-builder-nebius
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe

  npm_registry_read:
    name: npm-registry-read-only
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        rules:
          - allow:
              method: GET
              path: /**
    binaries:
      - path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe
